html{% extends 'catalog/base.html' %}

{% block title %}Вход на сайт{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4">Авторизация</h2>

            {% if form.errors %}
            <div class="alert alert-danger">
                Неверный email или пароль. Пожалуйста, попробуйте снова.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-3">Войти</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
