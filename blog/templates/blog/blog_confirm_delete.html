{% extends 'catalog/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4 bg-white rounded-3 text-center">
            <h2 class="text-danger mb-4">Удаление статьи</h2>
            <p class="fs-5 mb-4">Вы уверены, что хотите безвозвратно удалить статью <strong>"{{ object.title }}"</strong>?</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                    <a href="{% url 'blog:detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
