{% extends 'catalog/base.html' %}

{% block title %}Добавление товара | Интернет-магазин{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 bg-white p-5 rounded-3 shadow-sm">
        <h2 class="mb-4 text-center">Добавить новый товар</h2>
        
        <!-- Атрибут enctype обязателен для загрузки картинок! -->
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- Название товара -->
            <div class="mb-3">
                <label for="name" class="form-label">Наименование товара *</label>
                <input type="text" class="form-control" id="name" name="name" required placeholder="Например: Смартфон">
            </div>

            <!-- Категория товара -->
            <div class="mb-3">
                <label for="category" class="form-label">Категория *</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="" disabled selected>Выберите категорию...</option>
                    {% for category in categories %}
                        <option value="{{ category.pk }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Цена -->
            <div class="mb-3">
                <label for="price" class="form-label">Цена за покупку *</label>
                <input type="number" step="0.01" class="form-control" id="price" name="price" required placeholder="0.00">
            </div>

            <!-- Изображение -->
            <div class="mb-3">
                <label for="image" class="form-label">Изображение товара</label>
                <input type="file" class="form-control" id="image" name="image" accept="image/*">
            </div>

            <!-- Описание -->
            <div class="mb-3">
                <label for="description" class="form-label">Описание *</label>
                <textarea class="form-control" id="description" name="description" rows="4" required placeholder="Подробное описание товара..."></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">Сохранить товар</button>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary px-4">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
