<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная страница | Интернет-магазин</title>
    <!-- Подключаем Bootstrap через CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body class="bg-light">

    <!-- Простая навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Online Store</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/">Главная</a>
                <a class="nav-link" href="/contacts/">Контакты</a>
            </div>
        </div>
    </nav>

    <!-- Основной контент страницы -->
    <div class="container my-5">
        <div class="p-5 text-center bg-white rounded-3 shadow-sm">
            <h1 class="text-body-emphasis">Добро пожаловать в наш Каталог товаров!</h1>
            <p class="col-lg-8 mx-auto fs-5 text-muted">
                Здесь скоро появится самый лучший ассортимент электроники и
                гаджетов для вашего портфолио.
            </p>
            <div class="d-inline-flex gap-2 mb-5">
                <button class="d-inline-flex align-items-center btn btn-primary btn-lg px-4 rounded-pill"
                        type="button">
                    Смотреть товары
                </button>
            </div>
        </div>
    </div>

</body>
</html>
